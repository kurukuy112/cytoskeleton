<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter 9: The Cytoskeleton and Cell Motility</title>
<style>
:root{--bg:#f6f7f4;--panel:#ffffff;--ink:#1c2a24;--mute:#5b6b63;--acc:#1f7a5c;--acc2:#b4491f;--line:#d5dbd6;--mt:#2f6fb0;--mf:#b4491f;--if:#7a5c1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--panel:#1b2621;--ink:#e8efe9;--mute:#9fb0a6;--acc:#4fc79c;--acc2:#f0905f;--line:#2f3f37;--mt:#6fa8e0;--mf:#f0905f;--if:#d8b25c}}
:root[data-theme="dark"]{--bg:#121a16;--panel:#1b2621;--ink:#e8efe9;--mute:#9fb0a6;--acc:#4fc79c;--acc2:#f0905f;--line:#2f3f37;--mt:#6fa8e0;--mf:#f0905f;--if:#d8b25c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:clamp(16px,2.1vw,24px)/1.5 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
#stage{flex:1;overflow-y:auto;padding:4vh 6vw 2vh;display:flex;flex-direction:column;justify-content:center}
.slide{max-width:1000px;width:100%;margin:0 auto}
h1{font-size:1.9em;line-height:1.15;margin:0 0 .5em;font-weight:700}
h2{font-size:1.5em;line-height:1.2;margin:0 0 .6em;font-weight:700;border-left:6px solid var(--acc);padding-left:.5em}
.sec{color:var(--acc);font-size:.8em;margin-bottom:.3em}
ul{margin:0;padding-left:1.1em}li{margin:.35em 0}ul ul{font-size:.92em}
b{color:var(--acc)}i{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.7em .9em;font-size:.85em}
.card h3{margin:0 0 .3em;font-size:1.05em}
.mt{border-top:5px solid var(--mt)}.mf{border-top:5px solid var(--mf)}.if{border-top:5px solid var(--if)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.62em;min-width:560px}
th,td{border-bottom:1px solid var(--line);padding:.35em .5em;text-align:left;vertical-align:top}
th{color:var(--acc)}td:first-child{font-weight:700}
.fig{background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:.6em .9em;font-size:.8em;color:var(--mute);margin-top:.8em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7em;font-size:.8em}
.steps div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.6em}
.steps span{display:inline-block;background:var(--acc);color:var(--bg);border-radius:50%;width:1.5em;height:1.5em;text-align:center;margin-bottom:.3em}
nav{display:flex;align-items:center;gap:.6em;padding:.6em 4vw;border-top:1px solid var(--line);font:15px system-ui,sans-serif;color:var(--mute)}
nav button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.45em .9em;cursor:pointer}
nav button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}#fill{height:100%;background:var(--acc);width:0}
</style>
</head>
<body>
<main id="stage" aria-live="polite"></main>
<nav><button id="prev" aria-label="Previous slide">Prev</button><div id="bar"><div id="fill"></div></div><span id="num"></span><button id="next" aria-label="Next slide">Next</button></nav>
<script>
var S=[
['<h1>Chapter 9<br>The Cytoskeleton and Cell Motility</h1><p style="color:var(--mute)">Use ← → keys, swipe, or the buttons to move through the slides.</p><div class="fig">Figure (original): one cell stained for actin, microtubules and intermediate filaments, and the merged image.</div>'],
['<h2>Introduction</h2><ul><li>The <b>cytoskeleton</b> is a network of filamentous structures: <b>microtubules</b>, <b>microfilaments</b>, and <b>intermediate filaments</b>.</li></ul>'],
['<h2>Properties of cytoskeletal components</h2><div class="tw"><table><tr><th></th><th>Microtubules</th><th>Intermediate filaments</th><th>Actin filaments</th></tr><tr><td>Subunits</td><td>GTP-αβ-tubulin heterodimer</td><td>~70 different proteins</td><td>ATP-actin monomers</td></tr><tr><td>Site of incorporation</td><td>+ End (β-tubulin)</td><td>Internal</td><td>+ End (barbed)</td></tr><tr><td>Polarity</td><td>Yes</td><td>No</td><td>Yes</td></tr><tr><td>Enzymatic activity</td><td>GTPase</td><td>None</td><td>ATPase</td></tr><tr><td>Motor proteins</td><td>Kinesins, dyneins</td><td>None</td><td>Myosins</td></tr><tr><td>Associated proteins</td><td>MAPs</td><td>Plakins</td><td>Actin-binding proteins</td></tr><tr><td>Structure</td><td>Stiff, hollow, inextensible tube</td><td>Tough, flexible, extensible filament</td><td>Flexible, inextensible helical filament</td></tr><tr><td>Dimensions</td><td>25 nm outer diam.</td><td>10–12 nm diam.</td><td>8 nm diam.</td></tr><tr><td>Distribution</td><td>All eukaryotes</td><td>Animals</td><td>All eukaryotes</td></tr><tr><td>Primary functions</td><td>Support, intracellular transport, cell organization</td><td>Structural support</td><td>Motility, contractility</td></tr><tr><td>Subcellular location</td><td>Cytoplasm</td><td>Cytoplasm + nucleus</td><td>Cytoplasm</td></tr></table></div><p style="font-size:.6em;color:var(--mute)">Table 9.1</p>'],
['<div class="sec">9.1</div><h2>Overview of the Major Functions of the Cytoskeleton (1)</h2><ul><li>The cytoskeleton has many roles:<ul><li>Serves as a scaffold providing structural support and maintaining cell shape.</li><li>Serves as an internal framework to organize organelles within the cell.</li><li>Directs cellular locomotion and the movement of materials within the cell.</li></ul></li></ul>'],
['<h2>Structure and functions of the cytoskeleton</h2><div class="cols"><div class="card mt"><h3>(1) Structure and support</h3>Intermediate filaments and actin filaments, e.g. microvilli of the epithelial cell.</div><div class="card mt"><h3>(2) Intracellular transport</h3>Motor proteins move cargo along microtubules.</div><div class="card mf"><h3>(3) Contractility and motility</h3>Actin filaments, e.g. nerve growth cone and the dividing cell.</div><div class="card if"><h3>(4) Spatial organization</h3>Positions organelles such as the Golgi complex.</div></div><div class="fig">Figure (original): (a) epithelial cell, (b) nerve cell, (c) dividing cell.</div>'],
['<h2>Overview of the Major Functions of the Cytoskeleton (2)</h2><ul><li>Provides anchoring site for mRNA.</li><li>Serves as a signal transducer.</li><li>An essential component of the cell’s division machinery.</li></ul>'],
['<div class="sec">9.2</div><h2>Study of the Cytoskeleton (1)</h2><ul><li>The Use of Live-Cell Fluorescence Imaging<ul><li>Can be used to locate fluorescently-labeled target proteins.</li><li>Molecular processes can be observed (<i>live-cell imaging</i>).</li><li>Used to reveal the location of a protein present in very low concentrations.</li></ul></li></ul><div class="fig">Application (original): time-lapse series of a labeled filament growing across a cell, and a two-color fluorescence image.</div>'],
['<h2>Study of the Cytoskeleton (2)</h2><ul><li>The Use of <i>In Vitro</i> Single-Molecule Assays<ul><li>They make it possible to detect the activity of an individual protein molecule in real time.</li><li>Can be supplemented with atomic force microscopy to measure the mechanical properties of cytoskeletal elements.</li></ul></li></ul><div class="fig">Figure (original): video microscopy following a GFP-labeled kinesin moving along a microtubule toward its + end.</div>'],
['<div class="sec">9.3</div><h2>Microtubules (1)</h2><ul><li>Structure and Composition<ul><li>Microtubules are hollow, cylindrical structures.</li><li>The microtubule is a set of globular proteins arranged in longitudinal rows called <b>protofilaments</b>.</li><li>Microtubules contain 13 protofilaments.</li><li>Each protofilament is assembled from dimers of α- and β-tubulin subunits assembled into tubules with <i>plus</i> and <i>minus</i> ends.</li></ul></li></ul><div class="fig">Figures (original): FRAP of microtubules (prebleach, bleach, recovery at 300 and 500 s); tubulin lattice with 4 nm and 8 nm repeats and a seam; electron micrographs; α/β-tubulin structure bound to GTP and GDP.</div>'],
['<h2>Microtubules (2)</h2><ul><li>Microtubules as Structural Supports and Organizers<ul><li>The distribution of microtubules determines the shape of the cell.</li><li>Microtubules maintain the internal organization of cells.</li></ul></li></ul><div class="fig">Figure (original): a microtubule with the associated protein MAP2.</div>'],
['<h2>Microtubules (3)</h2><ul><li>Microtubules as Structural Supports and Organizers<ul><li>Microtubules function in axonal transport.</li><li>Microtubules play a role in axonal growth during embryogenesis.</li></ul></li></ul>'],
['<h2>Microtubules (4)</h2><ul><li>Microtubules as Structural Supports and Organizers<ul><li>In plant cells, microtubules help maintain cell shape by influencing formation of the cell wall.</li></ul></li></ul>'],
['<h2>Microtubules (5)</h2><ul><li>Microtubules as Agents of Intracellular Motility<ul><li>They facilitate movement of vesicles between compartments.</li><li>Axonal transport:<ul><li>Movement of neurotransmitters across the cell.</li><li>Movement away from the cell body (<i>anterograde</i>) and toward the cell body (<i>retrograde</i>).</li><li>Mediate tracks for a variety of <b>motor proteins</b>.</li></ul></li></ul></li></ul><div class="fig">Figures (original): electron micrograph of axonal transport; video frames following an organelle moving along an axon.</div>'],
['<h2>Microtubules (6)</h2><ul><li>Motor Proteins that Traverse the Microtubular Cytoskeleton<ul><li>Molecular motors convert energy from ATP into mechanical energy.</li><li>Molecular motors move unidirectionally along their cytoskeletal track in a stepwise manner.</li><li>Three categories of molecular motors:<ul><li>Kinesin and dynein move along microtubule tracks.</li><li>Myosin moves along microfilament tracks.</li></ul></li></ul></li></ul>'],
['<h2>Microtubules (7)</h2><ul><li>Kinesins<ul><li><b>Kinesin</b>—member of a superfamily called <b>KLPs (kinesin-like proteins)</b>.</li><li>A kinesin is a tetramer of two identical heavy chains and two identical light chains.</li><li>Each kinesin includes a pair of globular heads (<i>motor domain</i>), connected to a rod-like stalk.</li><li>Kinesin is a <i>plus end-directed microtubular motor</i> based on its movement.</li></ul></li></ul>'],
['<h2>Kinesin</h2><div class="steps"><div><span>1</span><br><b>Heads</b><br>Catalytic core</div><div><span>2</span><br><b>Neck</b><br>Flexible hinge region</div><div><span>3</span><br><b>Stalk</b><br>Heavy chains coiled together</div><div><span>4</span><br><b>Tail</b><br>Light chains; binds cargo</div></div><p style="font-size:.85em">Overall length is about 80 nm. The two heads alternate, stepping about 16 nm along the microtubule.</p>'],
['<h2>Microtubules (8)</h2><ul><li>Kinesins (continued)<ul><li>They move along a single protofilament of a microtubule at a velocity proportional to the ATP concentration.</li><li>Movement is <b>processive</b>: the motor protein moves along an individual microtubule for a long distance without falling off.</li><li>KLPs move cargo toward the cell’s plasma membrane.</li></ul></li></ul><div class="fig">Figure (original): kinesin-mediated organelle transport, with organelles spread out (a, c) or clustered near the center (b, d).</div>'],
['<h2>Microtubules (9)</h2><ul><li>Cytoplasmic Dynein<ul><li><b>Dynein</b> – responsible for the movement of cilia and flagella.</li><li><b>Cytoplasmic dynein</b> – huge protein with a globular, force-generating head.</li><li>It is a minus end-directed microtubular motor.</li><li>Requires an adaptor (<i>dynactin</i>) to interact with membrane-bounded cargo.</li></ul></li></ul>'],
['<h2>Cytoplasmic dynein</h2><div class="cols"><div class="card mt"><h3>Kinesin</h3>Moves toward the + end, carrying mitochondria and vesicles outward to the plasma membrane.</div><div class="card mf"><h3>Dynein</h3>Moves toward the − end, carrying lysosomes and vesicular tubular clusters (VTCs) inward toward the Golgi complex.</div></div><div class="fig">Figure (original): microtubules with their − ends at the Golgi and + ends toward the plasma membrane and ER.</div>'],
['<h2>Microtubules (10)</h2><ul><li>Microtubule-Organizing Centers (MTOCs)<ul><li><b>MTOCs</b> – specialized structures for the nucleation of microtubules.</li><li><b>Centrosome</b> – structures responsible for initiating microtubules in animal cells.<ul><li>It contains two barrel-shaped <b>centrioles</b> surrounded by <b>pericentriolar material (PCM)</b>.</li><li>Centrioles are usually found in pairs.</li></ul></li></ul></li></ul><div class="fig">Figure (original): The centrosome, with centriole and PCM, and microtubules radiating from it.</div>'],
['<h2>Microtubules (11)</h2><p>Microtubules grow from the centrosome. Tubulin dimers add at the + ends, while the − ends stay anchored at the centrioles.</p><div class="fig">Figure (original): a cell before and after microtubule growth from the centrosome next to the nucleus.</div>'],
['<h2>Microtubules (12)</h2><ul><li>Basal Bodies and Other MTOCs<ul><li><b>Basal body</b> – structure where outer microtubules in a cilia and flagella are generated.</li><li>Plant cells lack MTOCs and their microtubules are organized around the surface of the nucleus.</li></ul></li></ul>'],
['<h2>Microtubules (13)</h2><ul><li>Microtubule Nucleation<ul><li>MTOCs control the number of microtubules, their polarity, the number of protofilaments, and the time and location of their assembly.</li><li>The protein <b>γ-tubulin</b> is found in all MTOCs and is critical for microtubule nucleation.</li></ul></li></ul><div class="fig">Figure (original): The role of γ-tubulin in centrosome function. A γ-tubulin ring complex caps the − end of a growing microtubule.</div>'],
['<h2>Microtubules (14)</h2><ul><li>The Dynamic Properties of Microtubules</li><li>There are four distinct arrays of microtubules in a dividing plant cell:<ul><li>Widely distributed throughout the cortex.</li><li>Making a single transverse band.</li><li>In the form of a mitotic spindle.</li><li>As a <i>phragmoplast</i> assisting in the formation of the cell wall of daughter cells.</li></ul></li></ul>'],
['<h2>Four arrays of microtubules in a plant cell</h2><div class="steps"><div><span>1</span><br>Cortical array</div><div><span>2</span><br>Preprophase band</div><div><span>3</span><br>Mitotic spindle</div><div><span>4</span><br>Phragmoplast</div></div>'],
['<h2>Microtubules (15)</h2><ul><li>The Dynamic Properties of Microtubules<ul><li>Newly formed microtubules branch at an angle of pre-existing microtubules.</li><li>The changes in spatial organization of microtubules are a combination of two mechanisms:<ul><li>Rearrangement of existing microtubules.</li><li>Disassembly of existing microtubules and reassembly of new ones in different locations.</li></ul></li></ul></li></ul><div class="fig">Figure (original): nucleation of plant microtubules by γ-tubulin complexes on existing microtubules.</div>'],
['<h2>Microtubules (16)</h2><ul><li>The Underlying Basis of Microtubule Dynamics<ul><li>Insight into factors that influence microtubule assembly and disassembly came from studies <i>in vitro</i>.</li><li>GTP is required for microtubule assembly.</li><li>Hydrolysis of GTP leads to a replacement of bound GDP by new GTP to “recharge” the tubulin dimer.</li></ul></li></ul>'],
['<h2>Structural cap model of dynamic instability</h2><div class="steps"><div><span>1</span><br>A cap of GTP dimers sits on the + end; the shaft is GDP dimers.</div><div><span>2</span><br>Tube closure behind the cap.</div><div><span>3</span><br>A stable tube grows.</div><div><span>4</span><br>Catastrophe: the cap is lost and protofilaments peel apart.</div></div><div class="fig">Based on microtubule assembly <i>in vitro</i>, where microtubules grow from the + end of axonemes.</div>']
];
var i=0,st=document.getElementById('stage'),num=document.getElementById('num'),fill=document.getElementById('fill');
function go(n){
  i=Math.max(0,Math.min(S.length-1,n));
  st.innerHTML='<section class="slide">'+S[i][0]+'</section>';
  st.scrollTop=0;
  num.textContent=(i+1)+' / '+S.length;
  fill.style.width=((i+1)/S.length*100)+'%';
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
}
document.getElementById('prev').onclick=function(){go(i-1)};
document.getElementById('next').onclick=function(){go(i+1)};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);
});
var x0=null;
st.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
st.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(d<0?i+1:i-1);x0=null});
var h=parseInt((location.hash||'').slice(1),10);
go(isNaN(h)?0:h-1);
</script>
</body>
</html>
